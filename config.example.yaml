# Example config for agenttienlen. Copy to config.yaml and edit.

# Path to trained YOLOv8 weights (train via vision/README.md instructions).
weights_path: weights/best.pt
conf_threshold: 0.35
iou_threshold: 0.5

# ADB serial: leave null to use the first available device. Common defaults:
#   MEmu        127.0.0.1:21503
#   BlueStacks  127.0.0.1:5555
#   LDPlayer    127.0.0.1:5555
adb_serial: null

# Capture resolution (must match the game's display resolution).
capture_width: 1280
capture_height: 720

# Loop pacing.
tick_seconds: 1.0
pass_timeout_seconds: 12.0

# Strategy: "heuristic" is the only built-in policy today.
policy_name: heuristic
